openapi: 3.1.0
info:
  title: Orders Service API
  version: 1.0.0
  description: Cart and checkout orchestration.
servers:
- url: http://orders:8000
paths:
  /cart/{user_id}:
    get:
      operationId: get_cart_user_id
      summary: GET /cart/<int:user_id>
      tags:
      - Orders
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '404':
          description: Not found
  /cart/{user_id}/items:
    post:
      operationId: post_cart_user_id_items
      summary: POST /cart/<int:user_id>/items
      tags:
      - Orders
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartItem'
        '400':
          description: Invalid request
  /orders:
    post:
      operationId: post_orders
      summary: POST /orders
      tags:
      - Orders
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Invalid request
    get:
      operationId: get_orders
      summary: GET /orders
      tags:
      - Orders
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
  /orders/{order_id}:
    get:
      operationId: get_orders_order_id
      summary: GET /orders/<int:order_id>
      tags:
      - Orders
      parameters:
      - name: order_id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: Not found
components:
  schemas:
    Cart:
      type: object
      properties:
        user_id:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
      required:
      - user_id
      - items
    CartItem:
      type: object
      properties:
        product_id:
          type: integer
        quantity:
          type: integer
      required:
      - product_id
      - quantity
    Order:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        lines:
          type: array
          items:
            $ref: '#/components/schemas/OrderLine'
        total:
          type: number
        status:
          type: string
        payment_id:
          anyOf:
          - type: integer
          - type: 'null'
      required:
      - id
      - user_id
      - lines
      - total
      - status
    OrderLine:
      type: object
      properties:
        product_id:
          type: integer
        quantity:
          type: integer
        unit_price:
          type: number
      required:
      - product_id
      - quantity
      - unit_price
